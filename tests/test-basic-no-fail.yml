name: Test basic usage - no fail on import error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample JUnit XML test result
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results/test"
          cat > "$GITHUB_WORKSPACE/test-results/test/TEST-sample.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="SampleTest" tests="2" failures="0" errors="0" time="0.5">
            <testcase name="testOne" classname="com.example.SampleTest" time="0.2"/>
            <testcase name="testTwo" classname="com.example.SampleTest" time="0.3"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "true"
          username: "fake-client-id"
          password: "fake-client-secret"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "10000"
          importRetryLimit: "0"

      - name: Assert action ran and failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials, the cloud auth will fail and the action step
          # should report failure (core.setFailed is called on auth error).
          # continue-on-error: true allows the workflow to continue.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step outcome 'failure' with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials (outcome=$OUTCOME)"
