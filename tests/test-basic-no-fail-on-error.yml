name: Test basic usage with failOnImportError false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy JUnit XML test result
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-example.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ExampleSuite" tests="2" failures="0" errors="0" time="1.0">
            <testcase name="testOne" classname="com.example.TestClass" time="0.5"/>
            <testcase name="testTwo" classname="com.example.TestClass" time="0.5"/>
          </testsuite>
          EOF

      - id: xray
        uses: .
        with:
          xrayCloud: "true"
          xrayBaseUrl: "http://localhost:19999"
          username: "fake-client-id"
          password: "fake-client-secret"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          importRetryLimit: "0"
          responseTimeout: "5000"
        continue-on-error: true

      - name: Assert action ran and failed due to auth error
        env:
          OUTCOME: ${{ steps.xray.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials pointing to localhost, auth will fail immediately
          # The action should fail at the auth stage
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: expected outcome to be set"
            exit 1
          fi
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome=failure with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at auth stage with fake credentials (outcome=$OUTCOME)"
