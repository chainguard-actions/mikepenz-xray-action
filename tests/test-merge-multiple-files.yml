name: Test merge multiple test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit XML test results
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results/test"
          cat > "$GITHUB_WORKSPACE/test-results/test/TEST-suite1.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite1" tests="2" failures="0" errors="0" time="0.5">
            <testcase name="testA" classname="com.example.Suite1" time="0.2"/>
            <testcase name="testB" classname="com.example.Suite1" time="0.3"/>
          </testsuite>
          EOF
          cat > "$GITHUB_WORKSPACE/test-results/test/TEST-suite2.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite2" tests="1" failures="1" errors="0" time="0.4">
            <testcase name="testC" classname="com.example.Suite2" time="0.4">
              <failure message="assertion failed">Expected true but was false</failure>
            </testcase>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://jira.example.invalid"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/test-results/test/TEST-*.xml"
          testMerge: "true"
          testFormat: "junit"
          testExecKey: "PROJ-2"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert count output reflects merged files
        env:
          COUNT: ${{ steps.action.outputs.count }}
          FAILED: ${{ steps.action.outputs.failed }}
          COMPLETED: ${{ steps.action.outputs.completed }}
        run: |
          echo "count: $COUNT"
          echo "failed: $FAILED"
          echo "completed: $COMPLETED"
          # When testMerge=true with 2 junit files, they are merged into 1 file.
          # count should be 1 (merged into single file).
          if [ -z "$COUNT" ]; then
            echo "FAIL: count output was not set"
            exit 1
          fi
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: expected count >= 1 for merged files, got '$COUNT'"
            exit 1
          fi
          echo "PASS: count=$COUNT for merged test files"

      - name: Assert import failed due to invalid server URL
        env:
          FAILED: ${{ steps.action.outputs.failed }}
          COMPLETED: ${{ steps.action.outputs.completed }}
        run: |
          echo "failed: $FAILED"
          echo "completed: $COMPLETED"
          # With a fake/unreachable server URL, import should fail
          if [ -z "$FAILED" ]; then
            echo "FAIL: failed output was not set"
            exit 1
          fi
          if [ "$FAILED" -lt 1 ]; then
            echo "FAIL: expected at least 1 failed import with invalid server URL, got $FAILED"
            exit 1
          fi
          if [ "$COMPLETED" -ne 0 ]; then
            echo "FAIL: expected 0 completed imports with invalid server URL, got $COMPLETED"
            exit 1
          fi
          echo "PASS: import failed as expected with invalid server URL (failed=$FAILED, completed=$COMPLETED)"
