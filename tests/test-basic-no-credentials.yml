name: Test basic usage without credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When neither username nor xrayToken is provided, the action should fail
      # with "The required `username` is missing" before making any network calls.
      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "true"
          # username intentionally omitted
          # password intentionally omitted
          # xrayToken intentionally omitted
          testPaths: "**/nonexistent/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no username or xrayToken provided, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with missing credentials"
