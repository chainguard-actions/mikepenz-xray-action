name: Test basic cloud usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test result file
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-example.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ExampleSuite" tests="2" failures="0" errors="0" time="1.0">
            <testcase name="testOne" classname="ExampleSuite" time="0.5"/>
            <testcase name="testTwo" classname="ExampleSuite" time="0.5"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          xrayCloud: "true"
          username: "fake-client-id"
          password: "fake-client-secret"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          responseTimeout: "5000"
          importRetryLimit: "0"
        continue-on-error: true

      - name: Assert action failed due to auth error with fake cloud credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when using fake cloud credentials (auth should fail)"
            exit 1
          fi
          echo "PASS: action correctly failed with fake cloud credentials"
