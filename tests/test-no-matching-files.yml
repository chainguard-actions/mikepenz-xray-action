name: Test behavior when no test files match the glob pattern
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "true"
          username: "fake-client-id"
          password: "fake-client-secret"
          testPaths: "tests/fixtures/nonexistent/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"

      - name: Assert action ran and count is zero or action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.count }}
          COMPLETED: ${{ steps.action.outputs.completed }}
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "count: $COUNT"
          echo "completed: $COMPLETED"
          echo "failed: $FAILED"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            # When no files match, count should be 0
            if [ "$COUNT" != "0" ] && [ -n "$COUNT" ]; then
              echo "FAIL: expected count=0 when no files match, got count=$COUNT"
              exit 1
            fi
            echo "PASS: count=$COUNT (no files matched as expected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no matching files or invalid credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
