name: Test no matching test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use XrayServer (requiresAuth=false) so no auth call is made.
      # The glob pattern matches no files, so no HTTP requests are made at all.
      # The action should succeed and set count=0, failed=0, completed=0.
      - id: action
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://127.0.0.1:19999"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/nonexistent-path/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          importRetryLimit: "0"

      - name: Assert count output is zero when no files found
        env:
          COUNT: ${{ steps.action.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: expected count=0 when no files match the glob, got count='$COUNT'"
            exit 1
          fi
          echo "PASS: count=0 as expected when no files found"

      - name: Assert failed output is zero when no files found
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" != "0" ]; then
            echo "FAIL: expected failed=0 when no files found, got failed='$FAILED'"
            exit 1
          fi
          echo "PASS: failed=0 as expected when no files found"

      - name: Assert completed output is zero when no files found
        env:
          COMPLETED: ${{ steps.action.outputs.completed }}
        run: |
          echo "completed: $COMPLETED"
          if [ "$COMPLETED" != "0" ]; then
            echo "FAIL: expected completed=0 when no files found, got completed='$COMPLETED'"
            exit 1
          fi
          echo "PASS: completed=0 as expected when no files found"
