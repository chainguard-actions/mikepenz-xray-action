name: Test failOnImportError causes action failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal JUnit XML test result file for the action to find
      - name: Create test result file
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-example.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ExampleSuite" tests="1" failures="0" errors="0" time="0.1">
            <testcase name="exampleTest" classname="ExampleClass" time="0.1"/>
          </testsuite>
          EOF

      # Use XrayServer (requiresAuth=false) so no auth call is made.
      # The import will fail because the URL is unreachable.
      # With failOnImportError=true, the action should call core.setFailed().
      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://127.0.0.1:19999"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "true"
          continueOnImportError: "false"
          importRetryLimit: "0"
          responseTimeout: "5000"

      - name: Assert action failed due to import error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With failOnImportError=true and an unreachable server, the action should fail
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with failOnImportError=true and unreachable server, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed on import error"
