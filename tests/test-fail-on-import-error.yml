name: Test failOnImportError causes action failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a sample JUnit XML test result
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-fail.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="FailSuite" tests="1" failures="0" errors="0" time="0.1">
            <testcase name="testFail" classname="com.example.FailTest" time="0.1"/>
          </testsuite>
          EOF

      - id: xray
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "false"
          xrayBaseUrl: "http://localhost:9999"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-3"
          projectKey: "PROJ"
          failOnImportError: "true"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert action failed due to import error with failOnImportError=true
        env:
          OUTCOME: ${{ steps.xray.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when failOnImportError=true and server is unreachable, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with failOnImportError=true"

      - name: Assert failed count is greater than zero
        env:
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected failed output to be set"
            exit 1
          fi
          if [ "$FAILED" -lt 1 ]; then
            echo "FAIL: expected failed >= 1, got $FAILED"
            exit 1
          fi
          echo "PASS: failed=$FAILED (imports failed as expected with fake server)"

      - name: Assert count output is set
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: expected count output to be set"
            exit 1
          fi
          echo "PASS: count=$COUNT"
