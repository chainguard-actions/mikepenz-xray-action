name: Test failOnImportError behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "true"
          username: "fake-client-id"
          password: "fake-client-secret"
          testPaths: "tests/fixtures/test-results/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "true"
          continueOnImportError: "false"

      - name: Assert action fails or reports error outputs when credentials are invalid
        env:
          OUTCOME: ${{ steps.action.outcome }}
          FAILED: ${{ steps.action.outputs.failed }}
          ERROR_MSG: ${{ steps.action.outputs.errorMessage }}
          ERROR_CODE: ${{ steps.action.outputs.errorStatusCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "failed: $FAILED"
          echo "errorMessage: $ERROR_MSG"
          echo "errorStatusCode: $ERROR_CODE"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with failOnImportError=true and invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            # If somehow it succeeded (unlikely without real creds), verify outputs are set
            if [ -z "$FAILED" ]; then
              echo "FAIL: action succeeded but failed output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with failed=$FAILED"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
