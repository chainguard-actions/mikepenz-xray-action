name: Test failOnImportError=true causes step failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy JUnit test result
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-example.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ExampleSuite" tests="2" failures="1" errors="0" skipped="0">
            <testcase name="passingTest" classname="com.example.ExampleTest" time="0.001"/>
            <testcase name="failingTest" classname="com.example.ExampleTest" time="0.002">
              <failure message="assertion failed">Expected true but was false</failure>
            </testcase>
          </testsuite>
          EOF

      - id: xray
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "http://localhost:19999"
          username: "fake-user"
          password: "fake-pass"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "true"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "3000"
          importRetryLimit: "0"
        continue-on-error: true

      - name: Assert step failed due to import error
        env:
          OUTCOME: ${{ steps.xray.outcome }}
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "step outcome: $OUTCOME"
          echo "failed: $FAILED"
          # With xrayCloud=false and localhost URL, import fails (connection refused)
          # With failOnImportError=true, the action should call setFailed → outcome=failure
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with failOnImportError=true and unreachable server, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: step correctly failed when failOnImportError=true"
