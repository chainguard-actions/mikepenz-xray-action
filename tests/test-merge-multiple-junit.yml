name: Test merging multiple JUnit XML files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit XML test results
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-suite1.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite1" tests="1" failures="0" errors="0" time="0.1">
            <testcase name="testOne" classname="com.example.Suite1" time="0.1"/>
          </testsuite>
          EOF
          cat > test-results/test/TEST-suite2.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite2" tests="1" failures="0" errors="0" time="0.2">
            <testcase name="testTwo" classname="com.example.Suite2" time="0.2"/>
          </testsuite>
          EOF
          cat > test-results/test/TEST-suite3.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Suite3" tests="1" failures="0" errors="0" time="0.3">
            <testcase name="testThree" classname="com.example.Suite3" time="0.3"/>
          </testsuite>
          EOF

      - id: xray
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "http://localhost:9999"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testMerge: "true"
          testExecKey: "PROJ-4"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert count output is set
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: expected count output to be set"
            exit 1
          fi
          echo "PASS: count=$COUNT"

      - name: Assert merged into single import (count=1 when testMerge=true)
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: expected count=1 when testMerge=true (all files merged into one), got $COUNT"
            exit 1
          fi
          echo "PASS: files were merged into a single import (count=1)"

      - name: Assert failed output is set
        env:
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected failed output to be set"
            exit 1
          fi
          echo "PASS: failed=$FAILED"
