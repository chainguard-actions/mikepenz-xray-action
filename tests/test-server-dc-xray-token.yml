name: Test Xray Server/DC with xrayToken authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal JUnit XML test result file for the action to find
      - name: Create test result file
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-server.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ServerSuite" tests="2" failures="0" errors="0" time="0.5">
            <testcase name="serverTest1" classname="ServerClass" time="0.2"/>
            <testcase name="serverTest2" classname="ServerClass" time="0.3"/>
          </testsuite>
          EOF

      # Use XrayServer (requiresAuth=false) so no auth call is made.
      # xrayToken is used for Bearer auth in the import request.
      # The import will fail because the URL is unreachable, but failOnImportError=false
      # so the action should succeed and set outputs.
      - id: action
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://127.0.0.1:19999"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          importRetryLimit: "0"
          responseTimeout: "5000"

      - name: Assert count output is set
        env:
          COUNT: ${{ steps.action.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: expected count output to be set"
            exit 1
          fi
          echo "PASS: count output is set to '$COUNT'"

      - name: Assert failed output is set and greater than zero
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected failed output to be set"
            exit 1
          fi
          # With an unreachable server, imports should fail
          if [ "$FAILED" = "0" ]; then
            echo "FAIL: expected failed > 0 with unreachable server, got failed='$FAILED'"
            exit 1
          fi
          echo "PASS: failed='$FAILED' (import failed as expected with unreachable server)"

      - name: Assert completed output is set
        env:
          COMPLETED: ${{ steps.action.outputs.completed }}
        run: |
          echo "completed: $COMPLETED"
          if [ -z "$COMPLETED" ]; then
            echo "FAIL: expected completed output to be set"
            exit 1
          fi
          echo "PASS: completed output is set to '$COMPLETED'"
