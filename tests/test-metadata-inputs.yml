name: Test metadata inputs (fixVersion, revision, testEnvironments, testPlanKey)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use server mode (xrayCloud=false) so auth is skipped and outputs are
      # always set even when the import fails (network error to fake URL).
      # This test exercises the fixVersion, revision, testEnvironments, and
      # testPlanKey inputs which are optional metadata fields.
      - id: xray
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://jira.example.invalid"
          username: "fake-jira-user"
          password: "fake-jira-password"
          testPaths: "tests/fixtures/junit/TEST-sample.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          testPlanKey: "PROJ-100"
          testEnvironments: "staging;production"
          revision: "abc123def456"
          fixVersion: "1.0.0"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert count output is set
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: expected 'count' output to be set"
            exit 1
          fi
          echo "PASS: count output is set to '$COUNT'"

      - name: Assert failed output is set
        env:
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected 'failed' output to be set"
            exit 1
          fi
          echo "PASS: failed output is set to '$FAILED'"

      - name: Assert completed output is set
        env:
          COMPLETED: ${{ steps.xray.outputs.completed }}
        run: |
          echo "completed: $COMPLETED"
          if [ -z "$COMPLETED" ]; then
            echo "FAIL: expected 'completed' output to be set"
            exit 1
          fi
          echo "PASS: completed output is set to '$COMPLETED'"

      - name: Assert count equals failed plus completed
        env:
          COUNT: ${{ steps.xray.outputs.count }}
          FAILED: ${{ steps.xray.outputs.failed }}
          COMPLETED: ${{ steps.xray.outputs.completed }}
        run: |
          echo "count=$COUNT, failed=$FAILED, completed=$COMPLETED"
          EXPECTED=$((FAILED + COMPLETED))
          if [ "$COUNT" != "$EXPECTED" ]; then
            echo "FAIL: count ($COUNT) != failed ($FAILED) + completed ($COMPLETED) = $EXPECTED"
            exit 1
          fi
          echo "PASS: count = failed + completed"

      - name: Assert import failed (fake server URL)
        env:
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" -lt 1 ]; then
            echo "FAIL: expected at least 1 failed import with fake server URL, got $FAILED"
            exit 1
          fi
          echo "PASS: import failed as expected with fake server URL"

      - name: Assert count is 1 (single file)
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected count=1 for single file, got $COUNT"
            exit 1
          fi
          echo "PASS: count=1 as expected for single file"
