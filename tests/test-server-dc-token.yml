name: Test Xray Server/DC with Personal Access Token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://jira.example.com"
          xrayToken: "fake-personal-access-token"
          testPaths: "tests/fixtures/test-results/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          responseTimeout: "5000"

      - name: Assert action ran or failed gracefully against fake Server/DC URL
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.count }}
          FAILED: ${{ steps.action.outputs.failed }}
          COMPLETED: ${{ steps.action.outputs.completed }}
          ERROR_MSG: ${{ steps.action.outputs.errorMessage }}
        run: |
          echo "outcome: $OUTCOME"
          echo "count: $COUNT"
          echo "failed: $FAILED"
          echo "completed: $COMPLETED"
          echo "errorMessage: $ERROR_MSG"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$COUNT" ]; then
              echo "FAIL: action succeeded but count output is empty"
              exit 1
            fi
            echo "PASS: count=$COUNT completed=$COMPLETED failed=$FAILED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake Server/DC URL and token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
