name: Test Server/DC mode with xrayToken
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test result file
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-server.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ServerSuite" tests="1" failures="0" errors="0" time="0.5">
            <testcase name="testServer" classname="ServerSuite" time="0.5"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "http://localhost:19999"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testExecKey: "PROJ-2"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          responseTimeout: "3000"
          importRetryLimit: "0"
        continue-on-error: true

      - name: Assert count output is set
        env:
          COUNT: ${{ steps.action.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: expected count output to be set"
            exit 1
          fi
          echo "PASS: count=$COUNT"

      - name: Assert failed output is set and greater than 0
        env:
          FAILED: ${{ steps.action.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected failed output to be set"
            exit 1
          fi
          if [ "$FAILED" -lt "1" ]; then
            echo "FAIL: expected at least 1 failed import when using fake server URL"
            exit 1
          fi
          echo "PASS: failed=$FAILED (import correctly failed with fake server URL)"

      - name: Assert completed output is set
        env:
          COMPLETED: ${{ steps.action.outputs.completed }}
        run: |
          echo "completed: $COMPLETED"
          if [ -z "$COMPLETED" ]; then
            echo "FAIL: expected completed output to be set"
            exit 1
          fi
          echo "PASS: completed=$COMPLETED"
