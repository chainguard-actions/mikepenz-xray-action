name: Test Server/DC mode with token and extended inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create sample JUnit test result
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-server.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="ServerSuite" tests="1" failures="0" errors="0" time="0.2">
            <testcase name="serverTest" classname="ServerClass" time="0.2"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://jira.example.com"
          xrayToken: "fake-personal-access-token"
          testPaths: "**/test-results/test/TEST-server.xml"
          testMerge: "false"
          testFormat: "junit"
          testExecKey: "PROJ-200"
          projectKey: "PROJ"
          testPlanKey: "PROJ-50"
          testEnvironments: "staging;linux"
          revision: "abc123def456"
          fixVersion: "1.0.0"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert outputs exist
        env:
          COUNT: ${{ steps.action.outputs.count }}
          FAILED: ${{ steps.action.outputs.failed }}
          COMPLETED: ${{ steps.action.outputs.completed }}
          ERROR_MSG: ${{ steps.action.outputs.errorMessage }}
          ERROR_CODE: ${{ steps.action.outputs.errorStatusCode }}
        run: |
          echo "count: $COUNT"
          echo "failed: $FAILED"
          echo "completed: $COMPLETED"
          echo "errorMessage: $ERROR_MSG"
          echo "errorStatusCode: $ERROR_CODE"
          echo "PASS: action completed without fatal error"
