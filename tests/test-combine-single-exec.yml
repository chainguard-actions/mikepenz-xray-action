name: Test combineInSingleTestExec with multiple test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple dummy JUnit XML test results
        run: |
          mkdir -p test-results/test
          cat > test-results/test/TEST-module1.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Module1Suite" tests="1" failures="0" errors="0" time="0.1">
            <testcase name="module1Test" classname="Module1Class" time="0.1"/>
          </testsuite>
          EOF
          cat > test-results/test/TEST-module2.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="Module2Suite" tests="1" failures="0" errors="0" time="0.2">
            <testcase name="module2Test" classname="Module2Class" time="0.2"/>
          </testsuite>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "true"
          username: "fake-client-id"
          password: "fake-client-secret"
          testPaths: "**/test-results/test/TEST-*.xml"
          testFormat: "junit"
          testMerge: "true"
          testExecKey: "PROJ-3"
          projectKey: "PROJ"
          combineInSingleTestExec: "true"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert action ran (step outcome is set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake credentials, the action will fail at auth stage
          # We just verify the step ran (outcome is either success or failure, not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step ran with outcome=$OUTCOME"

      - name: Assert count output reflects multiple files found or auth failure
        env:
          COUNT: ${{ steps.action.outputs.count }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "count: $COUNT"
          echo "outcome: $OUTCOME"
          # With fake credentials, auth will fail before outputs are set
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COUNT" ]; then
              echo "FAIL: expected count output to be set on success"
              exit 1
            fi
            echo "PASS: count=$COUNT"
          else
            echo "PASS: action failed at auth stage as expected with fake credentials"
          fi

      - name: Assert failed and completed outputs are set or auth failure
        env:
          FAILED: ${{ steps.action.outputs.failed }}
          COMPLETED: ${{ steps.action.outputs.completed }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "failed: $FAILED"
          echo "completed: $COMPLETED"
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$FAILED" ]; then
              echo "FAIL: expected failed output to be set on success"
              exit 1
            fi
            if [ -z "$COMPLETED" ]; then
              echo "FAIL: expected completed output to be set on success"
              exit 1
            fi
            echo "PASS: failed=$FAILED, completed=$COMPLETED"
          else
            echo "PASS: action failed at auth stage as expected with fake credentials"
          fi
