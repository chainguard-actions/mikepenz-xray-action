name: Test combineInSingleTestExec with multiple test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          xrayCloud: "true"
          username: "fake-client-id"
          password: "fake-client-secret"
          testPaths: "tests/fixtures/test-results/TEST-*.xml"
          testFormat: "junit"
          testMerge: "true"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          combineInSingleTestExec: "true"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"

      - name: Assert action ran with multiple files or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COUNT: ${{ steps.action.outputs.count }}
          FAILED: ${{ steps.action.outputs.failed }}
          COMPLETED: ${{ steps.action.outputs.completed }}
        run: |
          echo "outcome: $OUTCOME"
          echo "count: $COUNT"
          echo "failed: $FAILED"
          echo "completed: $COMPLETED"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$COUNT" ]; then
              echo "FAIL: action succeeded but count output is empty"
              exit 1
            fi
            echo "PASS: count=$COUNT completed=$COMPLETED failed=$FAILED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real Xray credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
