name: Test combineInSingleTestExec option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use server mode (xrayCloud=false) so auth is skipped and outputs are
      # always set even when the import fails (network error to fake URL).
      # With testExecKey provided, combineInSingleTestExec has no effect on
      # the import flow (it only triggers when testExecKey is absent), so
      # we can still verify outputs are set correctly.
      - id: xray
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://jira.example.invalid"
          username: "fake-jira-user"
          password: "fake-jira-password"
          testPaths: "tests/fixtures/junit/TEST-*.xml"
          testFormat: "junit"
          testMerge: "false"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          combineInSingleTestExec: "true"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert count output is set
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: expected 'count' output to be set"
            exit 1
          fi
          echo "PASS: count output is set to '$COUNT'"

      - name: Assert failed output is set
        env:
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected 'failed' output to be set"
            exit 1
          fi
          echo "PASS: failed output is set to '$FAILED'"

      - name: Assert completed output is set
        env:
          COMPLETED: ${{ steps.xray.outputs.completed }}
        run: |
          echo "completed: $COMPLETED"
          if [ -z "$COMPLETED" ]; then
            echo "FAIL: expected 'completed' output to be set"
            exit 1
          fi
          echo "PASS: completed output is set to '$COMPLETED'"

      - name: Assert count equals failed plus completed
        env:
          COUNT: ${{ steps.xray.outputs.count }}
          FAILED: ${{ steps.xray.outputs.failed }}
          COMPLETED: ${{ steps.xray.outputs.completed }}
        run: |
          echo "count=$COUNT, failed=$FAILED, completed=$COMPLETED"
          EXPECTED=$((FAILED + COMPLETED))
          if [ "$COUNT" != "$EXPECTED" ]; then
            echo "FAIL: count ($COUNT) != failed ($FAILED) + completed ($COMPLETED) = $EXPECTED"
            exit 1
          fi
          echo "PASS: count = failed + completed"

      - name: Assert count is 2 (two fixture files, no merge)
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "FAIL: expected count>=2 without merge (2 fixture files), got $COUNT"
            exit 1
          fi
          echo "PASS: count=$COUNT >= 2 as expected without merge"
