name: Test multiple test files with merge
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use server mode (xrayCloud=false) so auth is skipped and outputs are
      # always set even when the import fails (network error to fake URL).
      # With testMerge=true and 2 fixture files, they are merged into 1 file
      # before import, so count should be 1.
      - id: xray
        uses: .
        with:
          xrayCloud: "false"
          xrayBaseUrl: "https://jira.example.invalid"
          username: "fake-jira-user"
          password: "fake-jira-password"
          testPaths: "tests/fixtures/junit/TEST-*.xml"
          testFormat: "junit"
          testMerge: "true"
          testExecKey: "PROJ-1"
          projectKey: "PROJ"
          failOnImportError: "false"
          continueOnImportError: "true"
          importParallelism: "1"
          responseTimeout: "5000"
          importRetryLimit: "0"

      - name: Assert count output is set
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ -z "$COUNT" ]; then
            echo "FAIL: expected 'count' output to be set"
            exit 1
          fi
          echo "PASS: count output is set to '$COUNT'"

      - name: Assert count is 1 (merged into single file)
        env:
          COUNT: ${{ steps.xray.outputs.count }}
        run: |
          echo "count: $COUNT"
          if [ "$COUNT" != "1" ]; then
            echo "FAIL: expected count=1 after merge, got $COUNT"
            exit 1
          fi
          echo "PASS: count=1 as expected after merge"

      - name: Assert failed output is set
        env:
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ -z "$FAILED" ]; then
            echo "FAIL: expected 'failed' output to be set"
            exit 1
          fi
          echo "PASS: failed output is set to '$FAILED'"

      - name: Assert completed output is set
        env:
          COMPLETED: ${{ steps.xray.outputs.completed }}
        run: |
          echo "completed: $COMPLETED"
          if [ -z "$COMPLETED" ]; then
            echo "FAIL: expected 'completed' output to be set"
            exit 1
          fi
          echo "PASS: completed output is set to '$COMPLETED'"

      - name: Assert import failed (fake server URL)
        env:
          FAILED: ${{ steps.xray.outputs.failed }}
        run: |
          echo "failed: $FAILED"
          if [ "$FAILED" -lt 1 ]; then
            echo "FAIL: expected at least 1 failed import with fake server URL, got $FAILED"
            exit 1
          fi
          echo "PASS: import failed as expected with fake server URL"
